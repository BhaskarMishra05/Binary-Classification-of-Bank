<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Predictor | Bhaskar Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      position: relative;
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.03;
      pointer-events: none;
      z-index: 100;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' /%3E%3C/svg%3E");
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 2rem 4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .back-link {
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .back-link:hover {
      color: #fff;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 8rem 4rem 4rem;
    }

    .header {
      text-align: center;
      margin-bottom: 4rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
      text-transform: uppercase;
      color: #999;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      background: linear-gradient(180deg, #fff 0%, #666 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1rem;
      color: #666;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 3rem;
      align-items: start;
    }

    .form-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 3rem;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 2rem;
      color: #e2e8f0;
      letter-spacing: -0.02em;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #999;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      font-size: 0.95rem;
      font-family: 'Space Grotesk', sans-serif;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .form-group input::placeholder {
      color: #444;
    }

    .form-group select option {
      background: #1a1a1a;
      color: #fff;
    }

    .sidebar {
      position: sticky;
      top: 8rem;
    }

    .predict-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 2rem;
      text-align: center;
    }

    .quick-fill {
      width: 100%;
      padding: 0.9rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      color: #999;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Space Grotesk', sans-serif;
    }

    .quick-fill:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .predict-btn {
      width: 100%;
      padding: 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      background: #fff;
      border: none;
      border-radius: 50px;
      color: #0a0a0a;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.01em;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
    }

    .predict-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255, 255, 255, 0.3);
    }

    .predict-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      color: #666;
      margin: 1.5rem 0;
      font-size: 0.9rem;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top: 2px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result {
      margin-top: 2rem;
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result.success {
      background: rgba(16, 185, 129, 0.05);
      border-color: rgba(16, 185, 129, 0.2);
    }

    .result.failure {
      background: rgba(239, 68, 68, 0.05);
      border-color: rgba(239, 68, 68, 0.2);
    }

    .result-text {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      letter-spacing: -0.02em;
    }

    .result-details {
      font-size: 0.85rem;
      color: #666;
      margin-top: 0.75rem;
    }

    .info-section {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      margin-bottom: 1rem;
    }

    .info-grid {
      display: grid;
      gap: 1rem;
    }

    .info-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 1rem;
      transition: all 0.3s ease;
    }

    .info-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .info-item h4 {
      font-size: 0.85rem;
      font-weight: 600;
      color: #999;
      margin-bottom: 0.25rem;
    }

    .info-item p {
      font-size: 0.8rem;
      color: #666;
      line-height: 1.5;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 4rem;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 50;
      text-align: center;
      font-size: 0.85rem;
      color: #666;
    }

    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      
      .sidebar {
        position: static;
      }
    }

    @media (max-width: 768px) {
      nav, footer {
        padding: 1.5rem 2rem;
      }

      .container {
        padding: 7rem 2rem 6rem;
      }
      
      .form-section {
        padding: 2rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="grain"></div>

  <nav>
    <div class="logo">BM</div>
    <a href="/" class="back-link">
      <i class="fas fa-arrow-left"></i>
      Back
    </a>
  </nav>

  <div class="container">
    <div class="header">
      <div class="badge">
        <i class="fas fa-sparkles"></i>
        <span>Prediction System</span>
      </div>
      <h1>Customer Analysis</h1>
      <p class="subtitle">
        Enter customer information to predict subscription likelihood
      </p>
    </div>

    <div class="main-grid">
      <div class="form-section">
        <h2 class="section-title">Customer Information</h2>
        
        <form id="predictionForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="age">Age</label>
              <input type="number" id="age" name="age" placeholder="35" required min="18" max="100">
            </div>

            <div class="form-group">
              <label for="job">Job Category</label>
              <select id="job" name="job" required>
                <option value="">Select job</option>
                <option value="admin.">Admin</option>
                <option value="technician">Technician</option>
                <option value="services">Services</option>
                <option value="management">Management</option>
                <option value="blue-collar">Blue-collar</option>
                <option value="retired">Retired</option>
                <option value="entrepreneur">Entrepreneur</option>
                <option value="self-employed">Self-employed</option>
                <option value="housemaid">Housemaid</option>
                <option value="unemployed">Unemployed</option>
                <option value="student">Student</option>
                <option value="unknown">Unknown</option>
              </select>
            </div>

            <div class="form-group">
              <label for="marital">Marital Status</label>
              <select id="marital" name="marital" required>
                <option value="">Select status</option>
                <option value="married">Married</option>
                <option value="single">Single</option>
                <option value="divorced">Divorced</option>
              </select>
            </div>

            <div class="form-group">
              <label for="education">Education Level</label>
              <select id="education" name="education" required>
                <option value="">Select education</option>
                <option value="primary">Primary</option>
                <option value="secondary">Secondary</option>
                <option value="tertiary">Tertiary</option>
                <option value="unknown">Unknown</option>
              </select>
            </div>

            <div class="form-group">
              <label for="default">Credit Default</label>
              <select id="default" name="default" required>
                <option value="">Select option</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="balance">Account Balance (€)</label>
              <input type="number" id="balance" name="balance" placeholder="1500" required>
            </div>

            <div class="form-group">
              <label for="housing">Housing Loan</label>
              <select id="housing" name="housing" required>
                <option value="">Select option</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="loan">Personal Loan</label>
              <select id="loan" name="loan" required>
                <option value="">Select option</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="contact">Contact Method</label>
              <select id="contact" name="contact" required>
                <option value="">Select method</option>
                <option value="cellular">Cellular</option>
                <option value="telephone">Telephone</option>
                <option value="unknown">Unknown</option>
              </select>
            </div>

            <div class="form-group">
              <label for="day">Last Contact Day</label>
              <input type="number" id="day" name="day" placeholder="15" required min="1" max="31">
            </div>

            <div class="form-group">
              <label for="month">Last Contact Month</label>
              <select id="month" name="month" required>
                <option value="">Select month</option>
                <option value="jan">January</option>
                <option value="feb">February</option>
                <option value="mar">March</option>
                <option value="apr">April</option>
                <option value="may">May</option>
                <option value="jun">June</option>
                <option value="jul">July</option>
                <option value="aug">August</option>
                <option value="sep">September</option>
                <option value="oct">October</option>
                <option value="nov">November</option>
                <option value="dec">December</option>
              </select>
            </div>

            <div class="form-group">
              <label for="duration">Call Duration (seconds)</label>
              <input type="number" id="duration" name="duration" placeholder="180" required min="0">
            </div>

            <div class="form-group">
              <label for="campaign">Campaign Contacts</label>
              <input type="number" id="campaign" name="campaign" placeholder="2" required min="1">
            </div>

            <div class="form-group">
              <label for="pdays">Days Since Last Campaign</label>
              <input type="number" id="pdays" name="pdays" placeholder="-1" required>
            </div>

            <div class="form-group">
              <label for="previous">Previous Contacts</label>
              <input type="number" id="previous" name="previous" placeholder="1" required min="0">
            </div>

            <div class="form-group">
              <label for="poutcome">Previous Campaign Outcome</label>
              <select id="poutcome" name="poutcome" required>
                <option value="">Select outcome</option>
                <option value="success">Success</option>
                <option value="failure">Failure</option>
                <option value="other">Other</option>
                <option value="unknown">Unknown</option>
              </select>
            </div>
          </div>
        </form>
      </div>

      <div class="sidebar">
        <div class="predict-card">
          <button type="button" class="quick-fill" onclick="fillSampleData()">
            Fill Sample Data
          </button>

          <button type="submit" class="predict-btn" form="predictionForm">
            Analyze Customer
          </button>
          
          <div class="loading" id="loading">
            <div class="spinner"></div>
            <span>Processing...</span>
          </div>
          
          <div class="result" id="result">
            <div class="result-text" id="resultText"></div>
            <div class="result-details" id="resultDetails"></div>
          </div>

          <div class="info-section">
            <div class="info-title">Model Info</div>
            <div class="info-grid">
              <div class="info-item">
                <h4>Accuracy</h4>
                <p>90.96% on test data</p>
              </div>
              <div class="info-item">
                <h4>Algorithm</h4>
                <p>Ensemble ML</p>
              </div>
              <div class="info-item">
                <h4>Training Data</h4>
                <p>750K+ records</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <strong>Bhaskar Mishra</strong>
  </footer>

  <script>
    function fillSampleData() {
      const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];

      document.getElementById('age').value = rand(18, 90);
      document.getElementById('job').value = choice(['management', 'blue-collar', 'technician', 'admin.', 'services', 'retired']);
      document.getElementById('marital').value = choice(['married', 'single', 'divorced']);
      document.getElementById('education').value = choice(['primary', 'secondary', 'tertiary']);
      document.getElementById('default').value = choice(['yes', 'no']);
      document.getElementById('balance').value = rand(-2000, 25000);
      document.getElementById('housing').value = choice(['yes', 'no']);
      document.getElementById('loan').value = choice(['yes', 'no']);
      document.getElementById('contact').value = choice(['cellular', 'telephone']);
      document.getElementById('day').value = rand(1, 31);
      document.getElementById('month').value = choice(['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']);
      document.getElementById('duration').value = rand(10, 4000);
      document.getElementById('campaign').value = rand(1, 50);
      document.getElementById('pdays').value = choice([-1, rand(1, 800)]);
      document.getElementById('previous').value = rand(0, 60);
      document.getElementById('poutcome').value = choice(['unknown', 'failure', 'success', 'other']);
    }

    (function() {
      const BACKEND_URL = 'http://127.0.0.1:5000/predict';
      const form = document.getElementById('predictionForm');
      const btn = document.querySelector('.predict-btn');
      const loading = document.getElementById('loading');
      const result = document.getElementById('result');
      const resultText = document.getElementById('resultText');
      const resultDetails = document.getElementById('resultDetails');

      function normalizePrediction(pred) {
        if (pred === undefined || pred === null) return null;
        if (typeof pred === 'string') {
          const p = pred.trim().toLowerCase();
          if (p === 'yes' || p === 'y' || p === 'true' || p === '1') return 'YES';
          if (p === 'no' || p === 'n' || p === 'false' || p === '0') return 'NO';
        }
        if (typeof pred === 'number') return pred === 1 ? 'YES' : 'NO';
        if (typeof pred === 'boolean') return pred ? 'YES' : 'NO';
        return null;
      }

      function formatConfidence(raw) {
        if (raw === undefined || raw === null || isNaN(raw)) return null;
        const n = Number(raw);
        return n <= 1 ? (n * 100) : n;
      }

      async function submitHandler(e) {
        e.preventDefault();
        result.style.display = 'none';
        resultText.innerHTML = '';
        resultDetails.textContent = '';
        btn.disabled = true;
        loading.style.display = 'flex';

        const formData = {};
        new FormData(form).forEach((value, key) => {
          formData[key] = value;
        });

        try {
          const resp = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData),
          });

          if (!resp.ok) {
            const text = await resp.text();
            throw new Error(`Server error: ${resp.status}`);
          }

          const data = await resp.json();
          const normalized = normalizePrediction(data.prediction ?? data.pred ?? data.label);
          const probabilityRaw = data.probability ?? data.proba ?? data.score ?? null;
          const confidenceRaw = data.confidence ?? probabilityRaw ?? null;
          const confidencePct = formatConfidence(confidenceRaw);
          const probabilityPct = formatConfidence(probabilityRaw);

          loading.style.display = 'none';
          btn.disabled = false;
          result.style.display = 'block';

          if (normalized === 'YES') {
            result.className = 'result success';
            resultText.innerHTML = '<i class="fas fa-check-circle"></i> Likely to Subscribe';
            resultText.style.color = '#10b981';
          } else if (normalized === 'NO') {
            result.className = 'result failure';
            resultText.innerHTML = '<i class="fas fa-times-circle"></i> Unlikely to Subscribe';
            resultText.style.color = '#ef4444';
          } else {
            if (probabilityPct !== null) {
              if (probabilityPct >= 50) {
                result.className = 'result success';
                resultText.innerHTML = '<i class="fas fa-check-circle"></i> Likely to Subscribe';
                resultText.style.color = '#10b981';
              } else {
                result.className = 'result failure';
                resultText.innerHTML = '<i class="fas fa-times-circle"></i> Unlikely to Subscribe';
                resultText.style.color = '#ef4444';
              }
            } else {
              result.className = 'result failure';
              resultText.innerHTML = '<i class="fas fa-question-circle"></i> Unknown';
              resultText.style.color = '#666';
            }
          }

          const parts = [];
          if (confidencePct !== null) parts.push(`Confidence: ${confidencePct.toFixed(1)}%`);
          if (probabilityPct !== null) parts.push(`Probability: ${probabilityPct.toFixed(1)}%`);
          resultDetails.textContent = parts.join(' | ') || '';

        } catch (err) {
          loading.style.display = 'none';
          btn.disabled = false;
          result.style.display = 'block';
          result.className = 'result failure';
          resultText.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error';
          resultDetails.textContent = err.message || 'Cannot connect to backend';
          console.error('Prediction error:', err);
        }
      }

      form.addEventListener('submit', submitHandler);
    })();
  </script>
</body>
</html>
