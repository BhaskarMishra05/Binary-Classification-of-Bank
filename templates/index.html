<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Subscription Predictor | Bhaskar Mishra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: 'Space Grotesk', sans-serif;
  background: #0a0a0a;
  color: #fff;
  overflow-x: hidden;
}

.grain {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0.03;
  pointer-events: none;
  z-index: 100;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' /%3E%3C/svg%3E");
  animation: grain 8s steps(10) infinite;
}

@keyframes grain {
  0%, 100% { transform: translate(0, 0); }
  10% { transform: translate(-5%, -10%); }
  20% { transform: translate(-15%, 5%); }
  30% { transform: translate(7%, -25%); }
  40% { transform: translate(-5%, 25%); }
  50% { transform: translate(-15%, 10%); }
  60% { transform: translate(15%, 0%); }
  70% { transform: translate(0%, 15%); }
  80% { transform: translate(3%, 35%); }
  90% { transform: translate(-10%, 10%); }
}

.cursor-dot {
  width: 8px;
  height: 8px;
  background: #fff;
  border-radius: 50%;
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  mix-blend-mode: difference;
  transition: transform 0.2s ease;
}

.cursor-outline {
  width: 40px;
  height: 40px;
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  transition: all 0.15s ease-out;
  mix-blend-mode: difference;
}

nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 2rem 4rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 50;
  background: rgba(10, 10, 10, 0.5);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.logo {
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.nav-links {
  display: flex;
  gap: 3rem;
  list-style: none;
}

.nav-links a {
  color: #666;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  transition: color 0.3s ease;
  position: relative;
}

.nav-links a:hover {
  color: #fff;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 0;
  width: 0;
  height: 1px;
  background: #fff;
  transition: width 0.3s ease;
}

.nav-links a:hover::after {
  width: 100%;
}

.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 0 2rem;
  position: relative;
  padding-bottom: 200px;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.4;
  animation: float 20s ease-in-out infinite;
  pointer-events: none;
}

.orb-1 {
  width: 500px;
  height: 500px;
  background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
  top: 10%;
  left: 10%;
  animation-delay: 0s;
}

.orb-2 {
  width: 400px;
  height: 400px;
  background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
  bottom: 20%;
  right: 15%;
  animation-delay: 3s;
}

.orb-3 {
  width: 300px;
  height: 300px;
  background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
  top: 50%;
  right: 30%;
  animation-delay: 6s;
}

@keyframes float {
  0%, 100% { 
    transform: translate(0, 0) scale(1);
  }
  33% { 
    transform: translate(30px, -50px) scale(1.1);
  }
  66% { 
    transform: translate(-30px, 30px) scale(0.9);
  }
}

.hero-content {
  max-width: 900px;
  text-align: center;
  position: relative;
  z-index: 10;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1.2rem;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 50px;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  margin-bottom: 3rem;
  text-transform: uppercase;
  color: #999;
}

.badge i {
  color: #667eea;
}

h1 {
  font-size: clamp(3rem, 10vw, 8rem);
  font-weight: 700;
  line-height: 0.95;
  letter-spacing: -0.04em;
  margin-bottom: 2rem;
  background: linear-gradient(180deg, #fff 0%, #666 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  font-size: clamp(1rem, 2vw, 1.3rem);
  color: #666;
  font-weight: 400;
  line-height: 1.6;
  max-width: 600px;
  margin: 0 auto 4rem;
  letter-spacing: -0.01em;
}

.cta-group {
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.btn {
  padding: 1.2rem 3rem;
  font-size: 1rem;
  font-weight: 600;
  text-decoration: none;
  border-radius: 50px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  font-family: 'Space Grotesk', sans-serif;
  border: none;
  cursor: pointer;
  letter-spacing: -0.01em;
}

.btn-primary {
  background: #fff;
  color: #0a0a0a;
  box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(255, 255, 255, 0.3);
}

.btn-secondary {
  background: transparent;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(255, 255, 255, 0.4);
}

.scroll-indicator {
  position: absolute;
  bottom: 3rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  color: #444;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.scroll-indicator::after {
  content: '';
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, #444, transparent);
  animation: scrollLine 2s ease-in-out infinite;
}

@keyframes scrollLine {
  0%, 100% { opacity: 0; transform: translateY(-10px); }
  50% { opacity: 1; transform: translateY(10px); }
}

footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 1.5rem 4rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 50;
  background: rgba(10, 10, 10, 0.5);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.footer-left {
  font-size: 0.85rem;
  color: #666;
}

.footer-left strong {
  color: #fff;
  font-weight: 600;
}

.social-links {
  display: flex;
  gap: 2rem;
}

.social-links a {
  color: #666;
  text-decoration: none;
  font-size: 1.1rem;
  transition: color 0.3s ease;
}

.social-links a:hover {
  color: #fff;
}

@media (max-width: 768px) {
  nav, footer {
    padding: 1.5rem 2rem;
  }
  
  .nav-links {
    gap: 1.5rem;
  }
  
  .nav-links a {
    font-size: 0.8rem;
  }
  
  .hero {
    padding: 0 1.5rem;
    padding-bottom: 200px;
  }
  
  .cta-group {
    flex-direction: column;
    width: 100%;
  }
  
  .btn {
    width: 100%;
    justify-content: center;
  }
  
  footer {
    flex-direction: column;
    gap: 1rem;
    text-align: center;
  }
  
  .orb {
    filter: blur(60px);
  }
}

@media (max-width: 480px) {
  nav .logo {
    font-size: 1rem;
  }
  
  .nav-links {
    display: none;
  }
}
</style>
</head>
<body>
<div class="grain"></div>
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-outline" id="cursorOutline"></div>

<nav>
  <div class="logo">BM</div>
  <ul class="nav-links">
    <li><a href="#work">Work</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<main class="hero">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  
  <div class="hero-content">
    <div class="badge">
      <i class="fas fa-sparkles"></i>
      <span>AI Powered</span>
    </div>
    
    <h1>Bank Subscription<br>Predictor</h1>
    
    <p class="subtitle">
      Intelligent machine learning system that predicts customer subscription probability with precision and speed.
    </p>
    
    <div class="cta-group">
      <a href="#" class="btn btn-primary" onclick="launchPredictor(event)">
        <span>Launch App</span>
        <i class="fas fa-arrow-right"></i>
      </a>
      <a href="#" class="btn btn-secondary" onclick="viewDemo(event)">
        <span>View Demo</span>
      </a>
    </div>
  </div>
  
  <div class="scroll-indicator">
    Scroll
  </div>
</main>

<footer>
  <div class="footer-left">
    <strong>Bhaskar Mishra</strong> — Machine Learning Engineer
  </div>
  <div class="social-links">
    <a href="https://www.linkedin.com/in/bhaskar-mishra-026848221/" target="_blank" title="LinkedIn">
      <i class="fab fa-linkedin"></i>
    </a>
    <a href="https://github.com/BhaskarMishra05" target="_blank" title="GitHub">
      <i class="fab fa-github"></i>
    </a>
    <a href="mailto:bhaskarmishra1590@gmail.com" title="Email">
      <i class="fas fa-envelope"></i>
    </a>
  </div>
</footer>

<script>
const cursorDot = document.getElementById('cursorDot');
const cursorOutline = document.getElementById('cursorOutline');

let mouseX = 0, mouseY = 0;
let outlineX = 0, outlineY = 0;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  
  cursorDot.style.left = mouseX + 'px';
  cursorDot.style.top = mouseY + 'px';
});

function animateOutline() {
  outlineX += (mouseX - outlineX) * 0.15;
  outlineY += (mouseY - outlineY) * 0.15;
  
  cursorOutline.style.left = outlineX - 20 + 'px';
  cursorOutline.style.top = outlineY - 20 + 'px';
  
  requestAnimationFrame(animateOutline);
}

animateOutline();

const interactiveElements = document.querySelectorAll('a, button, .btn');

interactiveElements.forEach(el => {
  el.addEventListener('mouseenter', () => {
    cursorDot.style.transform = 'scale(1.5)';
    cursorOutline.style.transform = 'scale(1.5)';
  });
  
  el.addEventListener('mouseleave', () => {
    cursorDot.style.transform = 'scale(1)';
    cursorOutline.style.transform = 'scale(1)';
  });
});

function launchPredictor(event) {
  event.preventDefault();
  window.location.href = '/predictions';
}

function viewDemo(event) {
  event.preventDefault();
  alert('Demo feature coming soon!');
}

document.addEventListener('DOMContentLoaded', () => {
  const elements = document.querySelectorAll('.badge, h1, .subtitle, .cta-group');
  
  elements.forEach((el, index) => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(20px)';
    
    setTimeout(() => {
      el.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }, 100 * index);
  });
});

document.querySelectorAll('a[href^="#"]').forEach(anchor => {
  anchor.addEventListener('click', function (e) {
    e.preventDefault();
    const target = document.querySelector(this.getAttribute('href'));
    if (target) {
      target.scrollIntoView({ behavior: 'smooth' });
    }
  });
});
</script>
</body>
</html>
